version: '3.8'

# YANTRI Docker Compose
# Run: docker-compose up -d --build

services:
  # Frontend + Node.js API Server
  yantri-web:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: yantri-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - CLOUD_MODE=${CLOUD_MODE:-false}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OPENCODE_API_KEY=${OPENCODE_API_KEY}
      - OPENCODE_BASE_URL=${OPENCODE_BASE_URL}
      - OPENCODE_MODEL=${OPENCODE_MODEL}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      - CLOUD_MODE=${CLOUD_MODE}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}
      - AGENT_SHARED_SECRET=${AGENT_SHARED_SECRET}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_REGION=${S3_REGION}
      - S3_BUCKET=${S3_BUCKET}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - YANTRI_SYNC_ROOT=${YANTRI_SYNC_ROOT:-yantri}
      - YANTRI_SYNC_INTERVAL_MS=${YANTRI_SYNC_INTERVAL_MS:-300000}
      - YANTRI_AGENT_HOST=127.0.0.1
      - YANTRI_AGENT_PORT=8765
      - YANTRI_BROWSER_MODE=${YANTRI_BROWSER_MODE:-managed}
    volumes:
      - yantri-data:/app/data
      - yantri-logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    depends_on:
      - yantri-agent

  # Python Desktop Agent
  yantri-agent:
    build:
      context: .
      dockerfile: Dockerfile
      target: agent-build
    container_name: yantri-agent
    environment:
      - YANTRI_AGENT_HOST=0.0.0.0
      - YANTRI_AGENT_PORT=8765
      - AGENT_SHARED_SECRET=${AGENT_SHARED_SECRET}
      - YANTRI_BROWSER_MODE=${YANTRI_BROWSER_MODE:-managed}
      - YANTRI_CDP_URL=${YANTRI_CDP_URL}
    ports:
      - "8765:8765"
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8765/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    shm_size: 2g
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp:unconfined

volumes:
  yantri-data:
    driver: local
  yantri-logs:
    driver: local

networks:
  default:
    name: yantri-network